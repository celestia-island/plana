# PoleMos Agent Configuration
# 边缘计算与设备管理 Agent 的配置

[agent]
namespace = "layer1::polemos"
name = "PoleMos"
layer = 1

# SSH 远程主机配置
[[ssh_hosts]]
name = "edge-node-1"
host = "198.51.100.100"
port = 22
username = "edge"
# 认证方式: password | key
auth_method = "key"
key_path = "~/.ssh/id_rsa"

