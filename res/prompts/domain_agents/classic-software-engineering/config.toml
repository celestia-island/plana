[agent]
namespace = "layer2::classic_software_engineering"
name = "Classic Software Engineering"
layer = 2

[extensions.code_review_depth]
default = "full_review"
description = "Code review depth and scope"
signature = "fn(diff, language, project_context) -> ReviewResult"

[extensions.test_coverage_target]
default = "line_coverage_80"
description = "Test coverage target strategy"
signature = "fn(codebase, existing_tests) -> CoverageReport"

[extensions.refactoring_scope]
default = "function_level"
description = "Refactoring analysis scope"
signature = "fn(target_code, dependencies) -> RefactoringPlan"
