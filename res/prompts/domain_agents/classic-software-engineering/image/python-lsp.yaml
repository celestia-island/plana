id: python-lsp
display_name: "Python LSP (pyright)"
source_image: "python:3.12-alpine"
source_image_is_alpine: true
binary_paths:
  - /usr/local/bin
  - /usr/local/lib/python3.12
available_tools:
  pyright: "pyright --version"
  pyright-langserver: "pyright-langserver --version"
env:
  PATH_PREFIX: /usr/local/bin
  PYTHONDONTWRITEBYTECODE: "1"
supported_languages:
  - python
verify:
  - "pyright --version"
requires_network: true
lsp_servers:
  - language: python
    cmd:
      - pyright-langserver
      - --stdio
