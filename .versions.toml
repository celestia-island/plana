# Version drift gate configuration for `celestia-devtools verify-versions`.
#
# plana carries two independent release lines that intentionally diverge from
# the cargo workspace baseline: the published protocol crates are
# versioned on their own publish line, and the npm packages follow their own
# per-package line. Exemptions below record those deliberate divergences so the
# gate still fails on accidental drift.
#
# Tag namespaces for the two families (2026-10-24 audit UP-06):
#   cargo-v<version>     crates.io wave; <version> = packages/plana version
#                        (publish.yml compares the tag against that manifest)
#   plana-npm-v<version> npm family wave
# A release tag is only created on the squash-merged master commit — publish.yml
# rejects tags that are not ancestors of master.

[track]
# The npm baseline is pinned explicitly: the two publishable packages are
# versioned on independent lines (celestia-types 0.1.16, rpc-client 0.1.14), so
# the "majority among publishable packages" fallback would tie and resolve by
# filesystem walk order, which is not stable across machines. Track the
# rpc-client line as the baseline: it advances with the registry publish wave
# (currently 0.1.14 — the 0.1.14 release of #452 forgot to bump this pin in
# the same commit, unnoticed because the farm backlog cancelled every later
# master CI run; caught by #461's verify-versions run, 2026-10-21), while
# celestia-types is exempted below as its own line.
npm = "0.1.14"

[exempt.cargo]
"packages/celestia-types" = "independently published line"
"packages/dispatch-client" = "independently published line"
"packages/jsonrpc" = "independently published line"
"packages/plana" = "independently published line"
"packages/protocol-core" = "independently published line"
"packages/rpc-client" = "independently published line"
"packages/rpc-server" = "independently published line"
"packages/tauri" = "independently published line (plana-tauri: last crates.io release 0.1.20, next 0.1.21; it no longer inherits the workspace 0.1.51 umbrella line)"
"patches/ts-rs" = "vendored upstream ts-rs patch pinned to 12.0.1"
"patches/ts-rs-macros" = "vendored upstream ts-rs patch pinned to 12.0.1"

[exempt.npm]
"packages/celestia-types" = "independently published line"
"packages/evernight-protocol" = "independently published line (npm 0.1.0, crate follows the workspace baseline)"
