name: Publish crates.io

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Publish plana crates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Sequential publish order matters: plana-celestia-types depends on
      # plana-protocol-core, and the plana umbrella depends on all three.
      # Cargo.lock is NOT committed (it is gitignored): a fresh checkout has
      # no lockfile (so each publish would resolve independently), and a
      # persistent runner may carry a stale untracked one from a previous
      # run — `cargo publish --locked` then hard-fails with "cannot update
      # the lock file because --locked was passed". The generate-lockfile
      # step writes the CURRENT dependency graph into the checkout first,
      # and `--locked` pins all four publish steps to exactly that graph, so
      # the crates ship as one consistent snapshot of the same resolution.
      - name: Regenerate lockfile
        run: cargo generate-lockfile

      - name: Publish plana
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_API_TOKEN }}
        run: |
          if curl -fsSL -A "plana-release/1.0" "https://crates.io/api/v1/crates/plana" | grep -q '"max_version": "0.2.0"'; then
            echo "plana@0.2.0 already published — skipping"
          else
            cargo publish -p plana --locked
          fi
      - name: Publish plana-rpc-server
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_API_TOKEN }}
        run: |
          if curl -fsSL -A "plana-release/1.0" "https://crates.io/api/v1/crates/plana-rpc-server" | grep -q '"max_version": "0.1.0"'; then
            echo "plana-rpc-server@0.1.0 already published — skipping"
          else
            cargo publish -p plana-rpc-server --locked
          fi
      - name: Publish plana-rpc-client
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_API_TOKEN }}
        run: |
          if curl -fsSL -A "plana-release/1.0" "https://crates.io/api/v1/crates/plana-rpc-client" | grep -q '"max_version": "0.2.0"'; then
            echo "plana-rpc-client@0.2.0 already published — skipping"
          else
            cargo publish -p plana-rpc-client --locked
          fi
      - name: Publish plana-tauri
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_API_TOKEN }}
        run: |
          if curl -fsSL -A "plana-release/1.0" "https://crates.io/api/v1/crates/plana-tauri" | grep -q '"max_version": "0.1.20"'; then
            echo "plana-tauri@0.1.20 already published — skipping"
          else
            # --no-verify: the default bridge feature pulls the GTK/WebKit
            # system stack for the tarball verification build, which no
            # ubuntu runner carries by default; consumers build it in their
            # own environments. Everything battery-only is CI-verified
            # without the feature.
            cargo publish -p plana-tauri --locked --no-verify
          fi
      - name: Publish plana-celestia-types
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_API_TOKEN }}
        run: |
          if curl -fsSL -A "plana-release/1.0" "https://crates.io/api/v1/crates/plana-celestia-types" | grep -q '"max_version": "0.1.0"'; then
            echo "plana-celestia-types@0.1.0 already published — skipping"
          else
            cargo publish -p plana-celestia-types --locked
          fi

