name: Publish crates.io

# crates.io release line for the publishable plana crates.
#
# Tag namespace: `cargo-v<version>`, deliberately separate from the npm family's
# `plana-npm-v<version>` line — the two families advance independently. The
# `<version>` in the tag is the umbrella crate `packages/plana` version (the
# crate that tracks the crates release wave). The other publishable crates keep
# their own independent lines (plana-rpc-client 0.2.x, plana-celestia-types
# 0.1.x, plana-rpc-server 0.1.x, plana-tauri 0.1.x) and each decides for itself
# whether it still has to ship, by asking crates.io about its own manifest
# version.
#
# Two rules this replaces (2026-10-24 audit UP-06):
#
# 1. The old trigger was a bare `v*` and the guards compared crates.io's
#    `max_version` against hard-coded strings ("0.2.0", "0.2.0", "0.1.0",
#    "0.1.21", "0.1.0"). Once a manifest moved past its string the guard stayed
#    true, so the crate could never ship again; and where the string matched the
#    published max, a newer manifest version was silently skipped.
# 2. Tags used to be pushed on PR branches, so 11 of 20 `v*` tags are not
#    ancestors of master. A release tag must point at the squash-merged master
#    commit (AGENTS §4), which is what the ancestor guard below enforces.
on:
  push:
    tags: ["cargo-v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (must equal packages/plana, e.g. 0.2.1)"
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── Refuse to publish anything but the version the tag (or input) names ──
  verify-version:
    name: Verify the requested version
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history on purpose: `git merge-base --is-ancestor` cannot see
          # past a shallow boundary. A depth-1 checkout reports every non-tip
          # tag as "not on master" (probed 2026-10-24 on a fixture clone: a
          # depth-1 clone at an older tag returns FALSE even though the tag is a
          # direct ancestor of master).
          fetch-depth: 0
      - name: Resolve the requested version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#cargo-v}" >> "$GITHUB_OUTPUT"
          fi
      - name: Ensure the tag is on master
        if: github.event_name == 'push'
        run: |
          git fetch origin master
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
            echo "::error::$GITHUB_REF_NAME is not an ancestor of master — tag the squash-merged master commit, not the PR branch"
            exit 1
          fi
      - name: Compare with the umbrella manifest
        run: |
          WANT="${{ steps.version.outputs.version }}"
          HAVE=$(awk '
            /^\[package\]/ { in_pkg = 1; next }
            /^\[/ { in_pkg = 0 }
            in_pkg && /^version[[:space:]]*=/ {
              sub(/^version[[:space:]]*=[[:space:]]*"/, ""); sub(/".*$/, ""); print; exit
            }' packages/plana/Cargo.toml)
          if [ -z "$HAVE" ]; then
            echo "::error::could not read packages/plana/Cargo.toml version"
            exit 1
          fi
          if [ "$HAVE" != "$WANT" ]; then
            echo "::error::packages/plana version ($HAVE) != requested version ($WANT)"
            exit 1
          fi
          echo "Publishing the crates release wave $HAVE"

  # ── API diff gate: a breaking change may not ride a non-breaking bump ──
  #
  # cargo-semver-checks builds rustdoc JSON for the current tree and for the
  # crate's crates.io baseline, then refuses a release whose API diff needs a
  # bigger bump than the manifest asks for. This is the mechanism the
  # 2026-10-26 arch review (T1) asked for: #484 removed 15 public enum
  # variants with zero bump and nothing caught it.
  #
  # Scope = exactly the publishable members (publish != false). A crate that
  # has never shipped has no registry baseline to diff against (its FIRST
  # release is unchecked by definition and enters the gate on the second
  # one); a crate whose manifest version already equals the published one is
  # skipped by the publish job below anyway. Both skips are printed, never
  # silent. The publish=false members are listed at the end of the log as
  # explicitly out of scope.
  #
  # Verified locally (2026-10-27, cargo-semver-checks 0.51.0):
  #   - plana 0.2.1 → 0.2.2 with no API change: "no semver update required".
  #   - plana 0.2.1 → 0.2.2 with a removed pub fn: function_missing fires,
  #     "semver requires new major version", exit 100.
  #   - plana-tauri 0.1.21 → 0.1.22 --only-explicit-features: clean without
  #     any system deps on both sides.
  semver-checks:
    name: Semver API diff (published crates)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: verify-version
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-semver-checks (pinned release)
        run: |
          set -euo pipefail
          VER=0.51.0
          # The release asset name carries NO version prefix (verified:
          # the versioned spelling 404s, this one is 200).
          curl -fsSL "https://github.com/obi1kenobi/cargo-semver-checks/releases/download/v${VER}/cargo-semver-checks-x86_64-unknown-linux-musl.tar.gz" \
            | tar xz -C "$HOME/.cargo/bin"
          cargo semver-checks --version
      - name: API-diff every publishable crate against its crates.io baseline
        run: |
          set -euo pipefail

          # Same version reader as the publish job: fall back to
          # [workspace.package] for `version.workspace = true` members.
          manifest_version() {
            local manifest="$1" version
            version=$(awk '
              /^\[package\]/ { in_pkg = 1; next }
              /^\[/ { in_pkg = 0 }
              in_pkg && /^version[[:space:]]*=/ {
                sub(/^version[[:space:]]*=[[:space:]]*"/, ""); sub(/".*$/, ""); print; exit
              }' "$manifest")
            if [ -z "$version" ]; then
              version=$(awk '
                /^\[workspace\.package\]/ { in_ws = 1; next }
                /^\[/ { in_ws = 0 }
                in_ws && /^version[[:space:]]*=/ {
                  sub(/^version[[:space:]]*=[[:space:]]*"/, ""); sub(/".*$/, ""); print; exit
                }' Cargo.toml)
            fi
            printf '%s' "$version"
          }

          # publish=false means the member is NOT on the release line (unset
          # or `true` = publishable) — the gate only applies to the latter.
          manifest_publishable() {
            local pub
            pub=$(awk '
              /^\[package\]/ { in_pkg = 1; next }
              /^\[/ { in_pkg = 0 }
              in_pkg && /^publish[[:space:]]*=/ {
                sub(/^publish[[:space:]]*=[[:space:]]*/, ""); gsub(/[" ]/, ""); print; exit
              }' "$1")
            [ "${pub:-true}" != "false" ]
          }

          published_version() {
            # Distinguishes "not on crates.io" (HTTP 404 → empty output, a
            # legitimate SKIP) from "crates.io unreachable" (anything else
            # after retries → die). Conflating them would fail OPEN: a
            # published crate misread as never-released silently skips its
            # API diff — the exact hole this gate exists to close.
            local out code attempt
            code=""
            for attempt in 1 2 3; do
              out=$(curl -sSL -m 20 -A "plana-release/1.0" -w '\n%{http_code}' \
                "https://crates.io/api/v1/crates/$1" 2>/dev/null) && code=${out##*$'\n'} || code=""
              [ "$code" = "404" ] && return 0
              [ "$code" = "200" ] && break
              code=""
              sleep 5
            done
            if [ -z "$code" ]; then
              # stderr: this function usually runs inside a command
              # substitution, where stdout (including ::error:: workflow
              # commands) would be swallowed with the subshell.
              echo "semver gate: crates.io query for $1 failed after 3 attempts — refusing to guess (a published crate misread as never-released would skip its API diff)" >&2
              exit 1
            fi
            printf '%s' "${out%$'\n'*}" \
              | python3 -c 'import json,sys; print(json.load(sys.stdin)["crate"]["max_version"])'
          }

          # plana-tauri is checked with NO features enabled: cargo-semver-checks
          # enables every feature by default (its unstable-only heuristic),
          # which would pull `bridge` → the GTK/WebKit system stack the same
          # way the publish job's tarball verification does (that is why it
          # passes --no-verify). `--only-explicit-features` builds the pure
          # battery surface on BOTH sides (current and baseline alike).
          declare -A FEATURE_FLAGS=( [plana-tauri]="--only-explicit-features" )

          internal_skipped=()
          checked=0
          failed=0

          for manifest in packages/*/Cargo.toml; do
            crate=$(awk '
              /^\[package\]/ { in_pkg = 1; next }
              /^\[/ { in_pkg = 0 }
              in_pkg && /^name[[:space:]]*=/ {
                sub(/^name[[:space:]]*=[[:space:]]*"/, ""); sub(/".*$/, ""); print; exit
              }' "$manifest")
            if ! manifest_publishable "$manifest"; then
              internal_skipped+=("$crate")
              continue
            fi
            version=$(manifest_version "$manifest")
            base=$(published_version "$crate")
            if [ -z "$base" ]; then
              echo "::notice::$crate@$version was never released — no crates.io baseline to diff against; the gate starts on its second release"
              continue
            fi
            if [ "$version" = "$base" ]; then
              echo "$crate@$version already shipped at this version (the publish job skips it too) — API diff runs on the next bump"
              continue
            fi
            echo "=== $crate: $base (crates.io) -> $version (manifest) ==="
            flags=${FEATURE_FLAGS[$crate]:-}
            if cargo semver-checks check-release -p "$crate" $flags; then
              checked=$((checked + 1))
            else
              failed=$((failed + 1))
              echo "::error::$crate's API diff requires a bigger version bump than $version — see the lints above"
            fi
          done

          echo
          echo "semver gate summary: checked=$checked failed=$failed"
          echo "not on the release line (publish=false, gate not applicable): ${internal_skipped[*]}"
          [ "$failed" -eq 0 ]

  # ── Real publish, one crate at a time, skipping what is already shipped ──
  publish:
    name: Publish the crates
    runs-on: ubuntu-latest
    timeout-minutes: 120
    needs: [verify-version, semver-checks]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Cargo.lock is NOT committed (it is gitignored): a fresh checkout has
      # no lockfile (so each publish would resolve independently), and a
      # persistent runner may carry a stale untracked one from a previous
      # run — `cargo publish --locked` then hard-fails with "cannot update
      # the lock file because --locked was passed". The generate-lockfile
      # step writes the CURRENT dependency graph into the checkout first,
      # and `--locked` pins every publish step to exactly that graph, so the
      # crates ship as one consistent snapshot of the same resolution.
      - name: Regenerate lockfile
        run: cargo generate-lockfile

      - name: Publish every crate that still has to ship
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_API_TOKEN }}
        run: |
          set -euo pipefail

          # A crate's own manifest version. `version.workspace = true` would
          # mean the crate tracks [workspace.package] in the root manifest, so
          # fall back to that instead of hard-coding a version string.
          manifest_version() {
            local manifest="$1" version
            version=$(awk '
              /^\[package\]/ { in_pkg = 1; next }
              /^\[/ { in_pkg = 0 }
              in_pkg && /^version[[:space:]]*=/ {
                sub(/^version[[:space:]]*=[[:space:]]*"/, ""); sub(/".*$/, ""); print; exit
              }' "$manifest")
            if [ -z "$version" ]; then
              version=$(awk '
                /^\[workspace\.package\]/ { in_ws = 1; next }
                /^\[/ { in_ws = 0 }
                in_ws && /^version[[:space:]]*=/ {
                  sub(/^version[[:space:]]*=[[:space:]]*"/, ""); sub(/".*$/, ""); print; exit
                }' Cargo.toml)
            fi
            printf '%s' "$version"
          }

          # crates.io is the only authority on "already shipped": the manifest
          # version is what would be published, and the registry says whether
          # that exact version exists.
          is_published() {
            curl -fsSL -A "plana-release/1.0" "https://crates.io/api/v1/crates/$1/$2" >/dev/null
          }

          publish_crate() {
            local crate="$1" manifest="$2"
            shift 2
            local version
            version=$(manifest_version "$manifest")
            if [ -z "$version" ]; then
              echo "::error::no version found in $manifest"
              exit 1
            fi
            if is_published "$crate" "$version"; then
              echo "$crate@$version is already on crates.io — skipping"
            else
              echo "publishing $crate@$version"
              cargo publish -p "$crate" --locked "$@"
            fi
          }

          # Sequential order matters: plana-celestia-types depends on
          # plana-protocol-core, and the plana umbrella depends on all three.
          publish_crate plana packages/plana/Cargo.toml
          publish_crate plana-rpc-server packages/rpc-server/Cargo.toml
          publish_crate plana-rpc-client packages/rpc-client/Cargo.toml
          # --no-verify: the default bridge feature pulls the GTK/WebKit
          # system stack for the tarball verification build, which no
          # ubuntu runner carries by default; consumers build it in their
          # own environments. Everything battery-only is CI-verified
          # without the feature.
          publish_crate plana-tauri packages/tauri/Cargo.toml --no-verify
          publish_crate plana-celestia-types packages/celestia-types/Cargo.toml
          # T1 A-class wave (2026-10-27): the four generic platform crates,
          # closure-clean since #491/#492 (no unpublished family dependencies).
          # Names are service-agnostic per the naming ruling; order respects
          # the intra-wave dependency (llm_provider depends on config).
          publish_crate plana-config packages/config/Cargo.toml
          publish_crate plana-llm-provider packages/llm_provider/Cargo.toml
          publish_crate plana-infra-utils packages/infra_utils/Cargo.toml
          publish_crate plana-build-info packages/build_info/Cargo.toml
          # T4c-converged broker dispatch client (the wire contract carrier):
          # ships on its own 0.1.x line. Its only consumer today is
          # entelecheia, which switches from git to registry in a follow-up.
          # Renamed from plana-evernight-client (2026-10-27 ruling: published
          # crate names must stay service-agnostic; the old name is yanked).
          publish_crate plana-dispatch-client packages/dispatch-client/Cargo.toml
          # akivili-plugin-host unblock wave (2026-11-01): the dependency
          # closure of plana-domain-skills + plana-state-sync, renamed to the
          # hyphenated published-crate convention. Dependency order matters
          # within the batch; state-sync carries the local wire
          # ContainerStatus because the cherino git dependency was cut from
          # its manifest in this same PR (cherino is not on crates.io).
          publish_crate plana-macros packages/macros/Cargo.toml
          publish_crate plana-text packages/text/Cargo.toml
          publish_crate plana-core packages/core/Cargo.toml
          publish_crate plana-domain-agent packages/domain_agent/Cargo.toml
          publish_crate plana-state-sync packages/state_types/Cargo.toml
          publish_crate plana-domain-skills-permissions packages/domain_skills_permissions/Cargo.toml
          publish_crate plana-prompt packages/prompt/Cargo.toml
          publish_crate plana-domain-skills packages/domain_skills/Cargo.toml
