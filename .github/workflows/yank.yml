name: Yank crates.io

# Deliberate, manual yank lane: a yank takes a published version out of
# dependency resolution WITHOUT deleting it (existing lockfiles keep working;
# it cannot be undone except by publishing a higher version, or --undo to
# restore resolution). Its motivating case: published plana crate names must
# stay service-agnostic, so the 2026-10-27 rename of
# plana-evernight-client → plana-dispatch-client yanks the old name's release
# instead of leaving a service-branded crate on the public surface.
on:
  workflow_dispatch:
    inputs:
      crate:
        description: "Crate name to yank (e.g. plana-evernight-client)"
        required: true
      version:
        description: "Exact published version to yank (e.g. 0.1.0)"
        required: true
      undo:
        description: "Undo the yank instead (restore resolvability)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  yank:
    name: Yank ${{ inputs.crate }}@${{ inputs.version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Yank
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ "${{ inputs.undo }}" = "true" ]; then
            cargo yank --version "${{ inputs.version }}" "${{ inputs.crate }}" --undo
          else
            cargo yank --version "${{ inputs.version }}" "${{ inputs.crate }}"
          fi
          echo "yank done: ${{ inputs.crate }}@${{ inputs.version }} undo=${{ inputs.undo }}"
