name: CI

on:
  workflow_dispatch:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: [self-hosted, linux, x64, local]
    steps:
      - uses: actions/checkout@v7
      - name: Install libseccomp-dev (retry on apt lock contention)
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5; do
            if sudo apt-get update -qq && sudo apt-get install -y -qq libseccomp-dev; then
              exit 0
            fi
            echo "apt failed (attempt $i/5), waiting for lock to clear..."
            sleep 15
          done
          exit 1
      - name: Sync provider registry data
        run: python3 scripts/fetch_provider_registry.py
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo check --all-targets --all-features

  clippy:
    runs-on: [self-hosted, linux, x64, local]
    steps:
      - uses: actions/checkout@v7
      - name: Install libseccomp-dev (retry on apt lock contention)
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5; do
            if sudo apt-get update -qq && sudo apt-get install -y -qq libseccomp-dev; then
              exit 0
            fi
            echo "apt failed (attempt $i/5), waiting for lock to clear..."
            sleep 15
          done
          exit 1
      - name: Sync provider registry data
        run: python3 scripts/fetch_provider_registry.py
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --all-targets --all-features -- -D warnings

  fmt:
    runs-on: [self-hosted, linux, x64, local]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  test:
    runs-on: [self-hosted, linux, x64, local]
    steps:
      - uses: actions/checkout@v7
      - name: Install libseccomp-dev (retry on apt lock contention)
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5; do
            if sudo apt-get update -qq && sudo apt-get install -y -qq libseccomp-dev; then
              exit 0
            fi
            echo "apt failed (attempt $i/5), waiting for lock to clear..."
            sleep 15
          done
          exit 1
      - name: Sync provider registry data
        run: python3 scripts/fetch_provider_registry.py
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --all-features
