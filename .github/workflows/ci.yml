name: CI

on:
  workflow_dispatch:
  push:
    branches: [master]
  pull_request:
    branches: [master]
    types: [opened, reopened, ready_for_review, synchronize]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    # Fork pull requests pay for their own CI: this job is heavy (it compiles,
    # builds, tests or audits) and a fork's run would spend shared runner time on
    # untrusted content. The required commit-lint and PR-title checks are the
    # deliberate exception: they are sub-minute, execute no pull request code, and
    # hold no secrets.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64, local]
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v7
      - name: Install libseccomp-dev (retry on apt lock contention)
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5; do
            if sudo apt-get update -qq && sudo apt-get install -y -qq libseccomp-dev; then
              exit 0
            fi
            echo "apt failed (attempt $i/5), waiting for lock to clear..."
            sleep 15
          done
          exit 1
      - name: Sync provider registry data
        run: python3 scripts/fetch_provider_registry.py
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo check --all-targets --all-features

  clippy:
    # Fork pull requests pay for their own CI: this job is heavy (it compiles,
    # builds, tests or audits) and a fork's run would spend shared runner time on
    # untrusted content. The required commit-lint and PR-title checks are the
    # deliberate exception: they are sub-minute, execute no pull request code, and
    # hold no secrets.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64, local]
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v7
      - name: Install libseccomp-dev (retry on apt lock contention)
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5; do
            if sudo apt-get update -qq && sudo apt-get install -y -qq libseccomp-dev; then
              exit 0
            fi
            echo "apt failed (attempt $i/5), waiting for lock to clear..."
            sleep 15
          done
          exit 1
      - name: Sync provider registry data
        run: python3 scripts/fetch_provider_registry.py
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --all-targets --all-features -- -D warnings

  fmt:
    # Fork pull requests pay for their own CI: this job is heavy (it compiles,
    # builds, tests or audits) and a fork's run would spend shared runner time on
    # untrusted content. The required commit-lint and PR-title checks are the
    # deliberate exception: they are sub-minute, execute no pull request code, and
    # hold no secrets.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64, local]
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  test:
    # Fork pull requests pay for their own CI: this job is heavy (it compiles,
    # builds, tests or audits) and a fork's run would spend shared runner time on
    # untrusted content. The required commit-lint and PR-title checks are the
    # deliberate exception: they are sub-minute, execute no pull request code, and
    # hold no secrets.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64, local]
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v7
      - name: Install libseccomp-dev (retry on apt lock contention)
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5; do
            if sudo apt-get update -qq && sudo apt-get install -y -qq libseccomp-dev; then
              exit 0
            fi
            echo "apt failed (attempt $i/5), waiting for lock to clear..."
            sleep 15
          done
          exit 1
      - name: Sync provider registry data
        run: python3 scripts/fetch_provider_registry.py
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --all-features
      # Round-21's finding: the ts-rs export tests REGENERATE the bindings
      # in place — a hand-edited generated file (the estimate fields lived
      # only as a hand-edit for a week) was silently wiped on the next
      # regeneration, and nothing checked the tree afterwards. The ws/
      # bindings must be clean after the suite.
      #
      # `protocol-core-httpTypes.ts` used to be excluded here as a "known
      # vendored hand-curated shape" — which is exactly how it drifted: it
      # lost the `VersionReport` type and kept a stale `HealthResponse` doc
      # while the published npm package served that old contract (2026-10-06
      # audit). It is generated by `scripts/vendor_http_types.py` now, so the
      # same step checks it with `--check`.
      - name: Bindings regeneration drift (generated + vendored)
        # Round-22's Info-1: diff alone misses UNTRACKED new files a new
        # export would leave behind; porcelain also catches a file deleted
        # from the index while still on disk. Both run over the whole
        # bindings tree — everything in there is generated or vendored, so a
        # dirty path after the suite is always a real drift.
        run: |
          # Both bindings trees the suite regenerates: the domain package's
          # AND the foundation's own. The foundation path is what catches
          # "Rust changed, bindings never regenerated" — the suite rewrites
          # them in place, leaving that tree dirty against HEAD.
          git diff --exit-code -- packages/celestia-types/bindings/ packages/plana/bindings/
          test -z "$(git status --porcelain -- packages/celestia-types/bindings/ packages/plana/bindings/)"
          # The vendored copies are byte-compared against the foundation's
          # generated files; --check prints the first divergence.
          python3 scripts/vendor_http_types.py --check
          # The flat surface: every type a named-list file generates must
          # be either listed in index.ts or documented as a deliberate
          # shadow in its collision ledger — this is the gate that would
          # have caught VersionReport shipping absent (2026-10-06 audit).
          python3 scripts/check_flat_surface.py

  verify-versions:
    name: Verify version consistency
    uses: celestia-island/celestia-devtools/.github/workflows/verify-versions.yml@master

  family-versions:
    name: Family dependency identity
    uses: celestia-island/celestia-devtools/.github/workflows/family-versions.yml@master
