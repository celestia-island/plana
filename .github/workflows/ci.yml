name: CI

on:
  workflow_dispatch:
  push:
    branches: [master]
  pull_request:
    branches: [master]
    types: [opened, reopened, ready_for_review, synchronize]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: [self-hosted, linux, x64, local]
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v7
      - name: Install libseccomp-dev (retry on apt lock contention)
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5; do
            if sudo apt-get update -qq && sudo apt-get install -y -qq libseccomp-dev; then
              exit 0
            fi
            echo "apt failed (attempt $i/5), waiting for lock to clear..."
            sleep 15
          done
          exit 1
      - name: Sync provider registry data
        run: python3 scripts/fetch_provider_registry.py
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo check --all-targets --all-features

  clippy:
    runs-on: [self-hosted, linux, x64, local]
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v7
      - name: Install libseccomp-dev (retry on apt lock contention)
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5; do
            if sudo apt-get update -qq && sudo apt-get install -y -qq libseccomp-dev; then
              exit 0
            fi
            echo "apt failed (attempt $i/5), waiting for lock to clear..."
            sleep 15
          done
          exit 1
      - name: Sync provider registry data
        run: python3 scripts/fetch_provider_registry.py
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --all-targets --all-features -- -D warnings

  fmt:
    runs-on: [self-hosted, linux, x64, local]
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  test:
    runs-on: [self-hosted, linux, x64, local]
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v7
      - name: Install libseccomp-dev (retry on apt lock contention)
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5; do
            if sudo apt-get update -qq && sudo apt-get install -y -qq libseccomp-dev; then
              exit 0
            fi
            echo "apt failed (attempt $i/5), waiting for lock to clear..."
            sleep 15
          done
          exit 1
      - name: Sync provider registry data
        run: python3 scripts/fetch_provider_registry.py
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --all-features
      # Round-21's finding: the ts-rs export tests REGENERATE the bindings
      # in place — a hand-edited generated file (the estimate fields lived
      # only as a hand-edit for a week) was silently wiped on the next
      # regeneration, and nothing checked the tree afterwards. The ws/
      # bindings must be clean after the suite; httpTypes.ts is a known
      # vendored hand-curated shape and is excluded.
      - name: Bindings regeneration drift (ws/)
        # Round-22's Info-1: diff alone misses UNTRACKED new files a new
        # export would leave behind — porcelain catches both shapes.
        run: |
          git diff --exit-code -- packages/celestia-types/bindings/ws/
          test -z "$(git status --porcelain -- packages/celestia-types/bindings/ws/)" 

  verify-versions:
    name: Verify version consistency
    uses: celestia-island/celestia-devtools/.github/workflows/verify-versions.yml@master
