[package]
name = "plana-sibling"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = true
description = "Declarative sibling-service HTTP client with ordered failover, layered timeouts, credential injection and no-proxy-by-default for celestia-island services"
license-file.workspace = true

[lints]
workspace = true

[features]
default = []
# Reserved seam for the P2-1 observability baseline (per-call metric counters).
# Nothing is wired yet — `tracing` spans are the only telemetry plana-sibling
# emits today; the feature exists so consumers can gate on it now instead of
# turning a later metrics rollout into a semver-visible dependency addition.
metrics = []

[dependencies]
http.workspace = true
reqwest = { workspace = true, features = ["json"] }
rustls = { workspace = true }
secrecy = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["time"] }
tracing.workspace = true

[dev-dependencies]
secrecy.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "time"] }
tracing-subscriber = { workspace = true, features = ["env-filter", "json"] }
wiremock.workspace = true
