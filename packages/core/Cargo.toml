[package]
name = "plana-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = true
license-file.workspace = true
description = "Foundation domain types and vocabulary for the plana agent platform"

[lints]
workspace = true

[dependencies]
plana-config = { workspace = true }
plana-llm-provider = { workspace = true }

anyhow.workspace = true
async-trait.workspace = true
base64.workspace = true
bytes.workspace = true
chrono.workspace = true
os_info.workspace = true
parking_lot.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing-appender.workspace = true
tracing-subscriber.workspace = true
tracing.workspace = true
ts-rs.workspace = true
uuid.workspace = true
# yuuka is consumed from crates.io on the 0.10 line, declared directly (not
# through the workspace table) — same convention as celestia-types. This
# crate only uses `yuuka::derive_enum!` for the error-identity enums
# (`AgentErrorCode`); the kirino 0.6-line split noted in celestia-types'
# Cargo.toml does not apply here.
yuuka = { version = "^0.10" }
[dev-dependencies]

criterion = "^0.5"
[[bench]]
name = "core_bench"
harness = false
