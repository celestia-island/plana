[features]
# When enabled (via scepter's embedded-db), trusted env vars like
# ENTELECHEIA_CONFIG_DIR and ENTELECHEIA_DB_PATH are read at startup.
# In production this feature is OFF, so those env vars are ignored —
# preventing remote attackers from redirecting config/DB paths.
allow-env-overrides = []

[dev-dependencies]

anyhow.workspace = true
tempfile.workspace = true
