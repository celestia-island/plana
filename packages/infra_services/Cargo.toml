[package]
name = "plana-infra-services"
# Own version line, like packages/plana and packages/bootloader: this crate
# re-exports cherino types (`ContainerRuntimeType`, `Box<dyn ContainerOps>`), so a
# cherino major bump changes type identity for every consumer while
# cargo-semver-checks stays blind to it (the item paths read the same). A patch
# number would understate that break. The 0.9.0 bump carries the same rule for
# the lacrymira migration: `Persistence`/`PgLogWriter` constructors now take a
# `lacrymira_pg::PgExecutor`, another type-identity break for consumers.
# The 0.9.1 bump is a dependency-line move only (lacrymira/lacrymira-pg
# ^0.1 → ^0.2): this crate's own declarations did not change, and the
# `lacrymira_pg::PgExecutor` item paths consumers name are identical in
# both lines. The upstream 0.2 surface is additive but not invisible to
# consumers that ALSO use lacrymira directly (Select.lock/distinct,
# Update.returning, and an ungated Value::NaiveTimestamp variant on the
# closed enum): those consumers meet the additions through their own
# lacrymira upgrade when cargo unifies the graph with this ^0.2 edge —
# unlike 0.9.0, no constructor or signature OF THIS CRATE moved.
version = "0.9.1"
edition.workspace = true
rust-version.workspace = true
publish = true
license-file.workspace = true
description = "Container and platform service management for family hosts"

[lints]
workspace = true

[dependencies]

plana-config = { workspace = true }
# cli-backend enables the WSL Containers / Apple Container CLI adapters
# (cherino's Docker backend is on by default).
cherino = { workspace = true, features = ["cli-backend"] }
plana_core = { workspace = true }
plana-infra-utils = { workspace = true }
plana = { workspace = true }
plana_state_sync = { workspace = true }
anyhow.workspace = true
async-trait.workspace = true
base64.workspace = true
chrono.workspace = true
futures.workspace = true
lacrymira.workspace = true
lacrymira-pg.workspace = true
rand.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "time", "net", "io-util", "fs", "sync"] }
tokio-tungstenite.workspace = true
tracing-subscriber = { workspace = true, features = ["registry"] }
tracing.workspace = true
uuid.workspace = true
[target.'cfg(target_os = "linux")'.dependencies]
cherino-runtime.workspace = true

[dev-dependencies]

sqlx.workspace = true
tempfile.workspace = true

