[package]
name = "plana_infra_services"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
license-file.workspace = true

[lints]
workspace = true

[dependencies]

_config = { workspace = true }
# cli-backend enables the WSL Containers / Apple Container CLI adapters
# (cherino's Docker backend is on by default).
cherino = { workspace = true, features = ["cli-backend"] }
_core = { workspace = true }
_infra_utils = { workspace = true }
plana = { workspace = true }
_state_sync = { workspace = true }
anyhow.workspace = true
async-trait.workspace = true
base64.workspace = true
chrono.workspace = true
dirs.workspace = true
futures.workspace = true
rand.workspace = true
sea-orm.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "time", "net", "io-util", "fs", "sync"] }
tokio-tungstenite.workspace = true
tracing-subscriber = { workspace = true, features = ["registry"] }
tracing.workspace = true
uuid.workspace = true
[target.'cfg(target_os = "linux")'.dependencies]
cherino-runtime.workspace = true

[dev-dependencies]

tempfile.workspace = true
