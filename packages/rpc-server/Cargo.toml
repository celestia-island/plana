[package]
name = "plana-rpc-server"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
authors.workspace = true
license-file = "LICENSE"
description = "Production-grade strict WebSocket JSON-RPC 2.0 server framework for the PLANA service profile: control-lane writer, dispatch stall watchdog, connection admission, per-connection auth and per-request guards, heartbeat service, and an HTTP POST fallback on the same method map."
repository = "https://github.com/celestia-island/plana"
keywords = ["json-rpc", "websocket", "rpc", "server", "protocol"]
categories = ["api-bindings", "web-programming::websocket", "network-programming"]

[lints]
workspace = true

[features]
default = []

[dependencies]

axum = { workspace = true }
futures = { workspace = true }
plana = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]

futures = { workspace = true }
reqwest = { workspace = true }
rustls = { workspace = true }
tokio-tungstenite = { workspace = true }

[package.metadata.docs.rs]
all-features = true
