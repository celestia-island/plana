[package]
name = "plana-jsonrpc"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "JSON-RPC 2.0 framing and transport base for the PLANA protocol: request/response/notification correlation, typed method routing, and Unix-socket, HTTP and WebSocket bindings."
repository = "https://github.com/celestia-island/plana"
keywords = ["json-rpc", "protocol", "websocket", "unix-socket"]
categories = ["api-bindings", "web-programming::websocket", "network-programming"]

[features]
default = []

[dependencies]

anyhow = { workspace = true }
axum = { workspace = true }
futures = { workspace = true }
interprocess = { workspace = true }
paste = { version = "1" }
serde = { workspace = true }
serde_json = { workspace = true }
strum = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]

tempfile.workspace = true

[package.metadata.docs.rs]
all-features = true
