# Explicit model→band pattern table for plana_llm_provider's pricing fallback.
#
# This file replaces the hand-written substring ladder that lived in
# metering.rs (2026-10-03 snapshot, hand-converted FX, "order matters"
# nesting). Semantics mirror arona's model_pricing override layer: every
# pattern is a DECLARED substring matched against the lowercased model id;
# rows are matched IN ORDER and the first row that matches wins.
#
# A row matches when every substring in `all` is present AND every group in
# `any` has at least one member present (empty `all`/`any` = no constraint).
# Every row must declare at least one pattern overall — a catch-all row is
# forbidden (unknown models must stay unpriced, not silently banded).
#
# Numbers come from the registry snapshot (`models-snapshot.toml`, the
# checked-in last generation of provider-registry data) through the `anchor`
# field — a provider-qualified model whose published price IS this band's
# price. Rows the registry has no data for carry `legacy` numbers (with a
# mandatory reason): they keep the pre-refactor fallback values bit-for-bit.
#
# Refresh flow (explicit, networked — the build itself never fetches):
#   just regen-pricing        # sync provider-registry + regenerate snapshot
# then update anchors here if bands moved, and update the golden fixture
# consciously (the equivalence test pins it).

# ── GLM (Zhipu) ────────────────────────────────────────────────────────

[[band]]
id = "glm-flashx"
anchor = "zhipu_glm/glm-5.3-flashx"
all = ["glm", "flashx"]

[[band]]
id = "glm-prime"
anchor = "zhipu_glm/glm-5.3-prime"
all = ["glm", "prime"]

[[band]]
id = "glm-flash"
anchor = "zhipu_glm/glm-5.3-flash"
all = ["glm"]
any = [["flash", "air", "lite"]]

# The pro band rides Zhipu's own CNY list, converted by the registry.
# fx_assert: the registry's USD price must equal cny/rate at 2dp rounding;
# the golden equivalence test enforces it (the pre-refactor table computed
# the division unrounded — that spread is the one tolerated difference).
[[band]]
id = "glm-pro"
anchor = "zhipu_glm/glm-5.3"
all = ["glm"]
[band.fx_assert]
cny_input = 8.0
cny_output = 28.0
cny_cached = 2.0
rate = 6.5
tolerance = 0.005

