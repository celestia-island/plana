[package]
name = "plana-protocol-core"
version = "0.3.0"
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
authors.workspace = true
description = "Re-export shim for the generic protocol core, now absorbed into the plana protocol foundation (plana::protocol_core). Kept so existing pins keep compiling; depend on plana directly in new code."
publish = false

[lints]
workspace = true

[features]
# Forwards to the plana foundation's feature of the same name.
tracing-helpers = ["plana/tracing-helpers"]

[dependencies]
plana = { version = "0.2.0", path = "../plana" }
