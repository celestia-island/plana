[package]
name = "plana-state-sync"
# Own release line (does not track [workspace.package]): the SyncMessage /
# re-exported error-code surface is breaking-answered on this line — the
# 0.3.0 bump answered the SwarmCursorProjection variant, 0.4.0 answers the
# DependencyDown variant added to the re-exported plana-core enum.
version = "0.4.0"
edition.workspace = true
rust-version.workspace = true
publish = true
license-file.workspace = true
description = "Wire protocol and state types for the plana agent platform"

[lints]
workspace = true

[dependencies]

plana-config = { workspace = true }
plana_core = { workspace = true }
plana_domain_agent = { workspace = true }
plana_text = { workspace = true }
chrono.workspace = true
plana.workspace = true
plana-celestia-types.workspace = true
regex.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
toml.workspace = true
tracing.workspace = true
uuid.workspace = true
[dev-dependencies]

anyhow.workspace = true
