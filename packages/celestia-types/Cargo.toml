[package]
name = "plana-celestia-types"
version = "0.1.3"
edition = "2021"
rust-version.workspace = true
authors.workspace = true
license-file = "LICENSE"
description = "Celestia platform domain profile for the PLANA protocol: agent, task, panel, industrial and tool domain messages, built on the generic plana-protocol-core protocol."
repository = "https://github.com/celestia-island/plana"
keywords = ["json-rpc", "protocol", "ai-agent", "shared-types"]
categories = ["api-bindings", "data-structures"]
# Keep generated TS bindings out of the published crate.
exclude = ["bindings"]

# NOTE (migration): the `tracing-helpers` feature was removed from this crate
# when the generic core was split out — it moved to `plana-protocol-core`
# (`plana_protocol_core::tracing_helpers`, feature `tracing-helpers`), which
# the `plana` umbrella crate forwards. Enable it there instead.

[lints]
workspace = true

[features]
default = []

[dependencies]
# yuuka is consumed from crates.io on the 0.10 line. This crate uses
# `yuuka::patch` / `merge` / `diff` / `path` / `viewport`; the published 0.6
# line ships only lib/template/tools/utils, so 0.6 is not an option, while
# 0.10.0 (crates.io) carries every API used here. Registry consumption also
# keeps this crate publishable: a git dependency without a version requirement
# fails `cargo publish` ("all dependencies must have a version requirement").
#
# The family still carries two yuuka lines because kirino (Layer 0) is on 0.6,
# so a graph holding kirino + plana resolves both 0.6.x and 0.10.x. Unifying
# them needs an upstream move in either direction (kirino to 0.10, or a 0.6
# backport) and stays registered as the "yuuka single line" follow-up.
yuuka = { version = "^0.10" }

kirino = { workspace = true }
plana = { workspace = true }

schemars = { workspace = true }
serde = { workspace = true }
serde_json.workspace = true
thiserror.workspace = true
ts-rs = { workspace = true }
uuid.workspace = true

[dev-dependencies]

anyhow.workspace = true
toml.workspace = true

[package.metadata.docs.rs]
all-features = true
