[package]
name = "plana-celestia-types"
version = "0.1.3"
edition = "2021"
rust-version.workspace = true
authors.workspace = true
license-file = "LICENSE"
description = "Celestia platform domain profile for the PLANA protocol: agent, task, panel, industrial and tool domain messages, built on the generic plana-protocol-core protocol."
repository = "https://github.com/celestia-island/plana"
keywords = ["json-rpc", "protocol", "ai-agent", "shared-types"]
categories = ["api-bindings", "data-structures"]
# Keep generated TS bindings out of the published crate.
exclude = ["bindings"]

# NOTE (migration): the `tracing-helpers` feature was removed from this crate
# when the generic core was split out — it moved to `plana-protocol-core`
# (`plana_protocol_core::tracing_helpers`, feature `tracing-helpers`), which
# the `plana` umbrella crate forwards. Enable it there instead.

[lints]
workspace = true

[features]
default = []

[dependencies]
# yuuka stays on the git master line (0.10.x) on purpose: this crate uses
# `yuuka::patch` / `merge` / `diff` / `path` / `viewport`, none of which exist
# in the published 0.6 line (checked against the 0.6.2 crate: only
# lib/template/tools/utils ship there). kirino (Layer 0) still consumes yuuka
# 0.6.x from crates.io, so a graph holding both kirino and plana carries two
# yuuka lines (0.6.2 + 0.10.1, measured in shittim-chest's lock 2026-10-24).
# Fixing that needs one of two upstream moves - kirino moves to the 0.10 line,
# or the five protocol APIs are backported to 0.6 - so it is recorded as a
# follow-up ("yuuka single line", 2026-10-24 registry-first wave) instead of
# being forced here. Do not "simplify" this to ^0.6: the crate will not build.
yuuka = { git = "https://github.com/celestia-island/yuuka.git", branch = "master" }

kirino = { workspace = true }
plana = { workspace = true }

schemars = { workspace = true }
serde = { workspace = true }
serde_json.workspace = true
thiserror.workspace = true
ts-rs = { workspace = true }
uuid.workspace = true

[dev-dependencies]

anyhow.workspace = true
toml.workspace = true

[package.metadata.docs.rs]
all-features = true
