[package]
name = "plana-bootloader"
# Own version line, like packages/plana: this crate's public structs are
# constructible, so adding a field is a major break — a workspace patch bump
# (0.4.x) would fail the release's cargo-semver-checks gate.
version = "0.7.0"
edition.workspace = true
rust-version.workspace = true
publish = true
license-file.workspace = true
description = "Container bring-up and platform service bootstrap for family hosts"

[lints]
workspace = true

[features]
# The container-stack bring-up half (identity + stack modules, the bollard
# lane). Consumers that only need the native-service platform half (the
# chest desktop's resident-node panel) opt out with
# default-features = false — bollard's exact-pinned bollard-stubs then
# stay out of their graph entirely.
default = ["stack"]
stack = ["dep:bollard", "dep:cherino", "dep:plana_infra_services", "dep:plana-infra-utils"]

[dependencies]

cherino = { workspace = true, optional = true }
plana_infra_services = { workspace = true, optional = true }
plana-infra-utils = { workspace = true, optional = true }
anyhow.workspace = true
async-trait.workspace = true
bollard = { workspace = true, optional = true }
dirs.workspace = true
rand.workspace = true
serde = { workspace = true, features = ["derive"] }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "time", "process", "fs", "io-util"] }
toml.workspace = true
tracing.workspace = true
[dev-dependencies]

tempfile.workspace = true

