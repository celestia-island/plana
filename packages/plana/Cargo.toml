[package]
name = "plana"
version.workspace = true
edition = "2021"
rust-version.workspace = true
authors.workspace = true
license.workspace = true
license-file = "LICENSE"
description = "Typed JSON-RPC 2.0 protocol toolkit with shared wire types, Unix socket and HTTP/WebSocket transports, and server-side session management."
repository = "https://github.com/celestia-island/plana"
keywords = ["json-rpc", "protocol", "websocket", "unix-socket", "typescript"]
categories = ["api-bindings", "data-structures", "web-programming::websocket", "network-programming"]
# Keep generated TS bindings out of the published crate.
exclude = ["bindings"]

[features]
default = ["types"]
types = []
jsonrpc = [
    "types",
    "dep:anyhow",
    "dep:axum",
    "dep:futures",
    "dep:interprocess",
    "dep:paste",
    "dep:strum",
    "dep:tokio",
    "dep:tracing",
]
rpc-server = ["jsonrpc", "dep:maxminddb"]
tracing-helpers = ["dep:chrono", "dep:tracing-subscriber"]

[dependencies]

# ── types module (default feature) ────────────────────────────
hex.workspace = true
kirino = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true }
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
ts-rs = { workspace = true }
uuid.workspace = true

# ── types: tracing-helpers feature ────────────────────────────
chrono = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }

# ── jsonrpc module (jsonrpc feature) ──────────────────────────
anyhow = { workspace = true, optional = true }
axum = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
interprocess = { workspace = true, optional = true }
paste = { version = "1", optional = true }
strum = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }

# ── rpc-server module (rpc-server feature) ────────────────────
maxminddb = { version = "^0", optional = true }

[dev-dependencies]

anyhow.workspace = true
criterion = "^0.5"
tempfile.workspace = true
toml.workspace = true

[[bench]]
name = "jsonrpc_bench"
harness = false

[package.metadata.docs.rs]
all-features = true
