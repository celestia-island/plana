[package]
name = "plana"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
authors.workspace = true
license.workspace = true
license-file = "LICENSE"
description = "A typed application-layer messaging protocol built on JSON-RPC 2.0: just as HTTP layers on TCP, this stack defines message semantics, typed payloads and session behavior on top of JSON-RPC framing. Re-exports plana-types (message model) and plana-jsonrpc (framing and transports), plus server-side session management behind the rpc-server feature. Not a general-purpose RPC framework."
repository = "https://github.com/celestia-island/plana"
keywords = ["json-rpc", "protocol", "websocket", "unix-socket", "typescript"]
categories = ["api-bindings", "data-structures", "web-programming::websocket", "network-programming"]
# Keep generated TS bindings out of the published crate.
exclude = ["bindings"]

[features]
default = []
rpc-server = ["dep:axum", "dep:tokio", "dep:maxminddb", "dep:uuid", "dep:tracing"]

[dependencies]

plana-types = { version = "0.1.0", path = "../types" }
plana-jsonrpc = { version = "0.1.0", path = "../jsonrpc" }

# ── rpc-server module (rpc-server feature) ────────────────────
axum = { workspace = true, optional = true }
maxminddb = { version = "^0", optional = true }
tokio = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }

[dev-dependencies]

anyhow.workspace = true
criterion = "^0.5"
serde_json.workspace = true

[[bench]]
name = "jsonrpc_bench"
harness = false

[package.metadata.docs.rs]
all-features = true
