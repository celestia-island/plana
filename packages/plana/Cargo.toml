[package]
name = "plana"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
authors.workspace = true
license.workspace = true
license-file = "LICENSE"
description = "PLANA (Protocol for Live Agent Network Automation) - a typed application-layer protocol for real-time state synchronization and control between a client shell and a backend service runtime, built on JSON-RPC 2.0. Not a general-purpose RPC framework."
repository = "https://github.com/celestia-island/plana"
keywords = ["json-rpc", "protocol", "websocket", "unix-socket", "typescript"]
categories = ["api-bindings", "data-structures", "web-programming::websocket", "network-programming"]
# Keep generated TS bindings out of the published crate.
exclude = ["bindings"]

[features]
default = ["celestia"]
# The celestia-island platform domain profile (plana-celestia-types). PLANA is a
# general protocol; the celestia platform is its primary consumer, so its domain
# types ship by default and can be disabled for other uses.
celestia = ["dep:plana-celestia-types"]
rpc-server = ["celestia", "dep:axum", "dep:tokio", "dep:maxminddb", "dep:uuid", "dep:tracing"]

[dependencies]

plana-celestia-types = { version = "0.1.0", path = "../celestia-types", optional = true }
plana-jsonrpc = { version = "0.1.0", path = "../jsonrpc" }

# ── rpc-server module (rpc-server feature) ────────────────────
axum = { workspace = true, optional = true }
maxminddb = { version = "^0", optional = true }
tokio = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }

[dev-dependencies]

anyhow.workspace = true
criterion = "^0.5"
serde_json.workspace = true

[[bench]]
name = "jsonrpc_bench"
harness = false

[package.metadata.docs.rs]
all-features = true
