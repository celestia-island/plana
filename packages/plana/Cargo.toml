[package]
name = "plana"
version = "0.2.0"
edition = "2021"
rust-version.workspace = true
authors.workspace = true
license-file = "LICENSE"
description = "PLANA protocol foundation: the canonical JSON-RPC 2.0 wire layer (unix-socket / HTTP / WS bindings, typed method routing) merged with the generic protocol core (handshake, identity, RBAC, regions, health descriptors) — the base every plana-rpc-* and domain-profile crate builds on."
repository = "https://github.com/celestia-island/plana"
keywords = ["json-rpc", "protocol", "websocket", "unix-socket", "typescript"]
categories = ["api-bindings", "data-structures", "web-programming::websocket", "network-programming"]
# Keep generated TS bindings out of the published crate.
exclude = ["bindings"]

[lints]
workspace = true

[features]
default = []
# No-op compatibility features from the umbrella era: pins declaring
# `features = ["jsonrpc"]` / `["celestia"]` keep resolving. The celestia
# domain types are a direct `plana-celestia-types` dependency now.
jsonrpc = []
celestia = []
# The umbrella's own axum mounting module (geo descriptors + SSE lanes).
rpc-server = ["dep:maxminddb"]
# ShortTimer formatting for `tracing-subscriber` (`plana::tracing_helpers`).
tracing-helpers = ["dep:chrono", "dep:tracing-subscriber"]

[dependencies]
# ── absorbed from plana-jsonrpc ─────────────────────────────────
anyhow = { workspace = true }
axum = { workspace = true }
futures = { workspace = true }
interprocess = { workspace = true }
paste = { version = "1" }
serde = { workspace = true }
serde_json = { workspace = true }
strum = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
# ── absorbed from plana-protocol-core ───────────────────────────
hex = { workspace = true }
schemars = { workspace = true }
sha2 = { workspace = true }
ts-rs = { workspace = true }
# tracing-helpers feature
chrono = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }
# ── rpc-server module (rpc-server feature) ─────────────────────
maxminddb = { version = "^0", optional = true }

[dev-dependencies]
anyhow.workspace = true
criterion = "^0.5"
futures.workspace = true
serde_json.workspace = true
strum.workspace = true
tempfile.workspace = true
tokio.workspace = true

[[bench]]
name = "jsonrpc_bench"
harness = false

[package.metadata.docs.rs]
all-features = true
