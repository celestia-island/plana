[package]
name = "arona-supervisor"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["langyo <langyo.china@gmail.com>"]
license = "BUSL-1.1"
description = "Unified supervision / rolling-update / replication runtime for the celestia-island platform (entelecheia, shittim-chest, evernight)."
repository = "https://github.com/celestia-island/arona"
publish = false

[features]
default = []

# ── CoordinationLock backends (Layer 2) ───────────────────────
# POSIX advisory file lock (flock) — for evernight (JSONL / config).
file-lock = []
# Lease-based file lock with TTL auto-expiry on crash.
lease = ["file-lock"]
# PostgreSQL advisory lock — for entelecheia / shittim-chest.
pg-lock = []

# ── Zero-downtime listener handoff (Layer 3) ──────────────────
# systemd socket activation (pure-Rust: reads LISTEN_FDS / LISTEN_PID).
socket-activation = []

# ── Fault-tolerance strategies (Layer 2 / Layer 4) ────────────
# Subsystem A: peer replicas (load-balancing, of which rolling update is a sub-op).
replica = []
# Subsystem B: leader/follower (edge active-passive HA).
leader-follower = ["dep:uuid"]

[dependencies]
# Same-repo protocol contract types.
arona = { path = ".." }

tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "net", "signal", "sync", "time", "process", "io-util", "fs"] }
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
thiserror = "2"
async-trait = "0.1"

uuid = { version = "1", features = ["v4"], optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
