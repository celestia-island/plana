[package]
name = "arona"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["langyo <langyo.china@gmail.com>"]
license = "BUSL-1.1"
description = "Shared protocol and API types for the entelecheia multi-agent platform"
repository = "https://github.com/celestia-island/arona"
publish = true
# Keep generated TS bindings, Python devtools, and docs out of the published crate.
exclude = ["bindings", "devtools", "docs", ".cargo", "justfile", "package.json", "pnpm-workspace.yaml", "supervisor"]

[workspace]
members = ["supervisor"]
resolver = "2"

[features]
default = []
tracing-helpers = ["chrono", "tracing-subscriber"]

[dependencies]
serde = { version = "^1", features = ["derive"] }
serde_json = "^1"
thiserror = "^2"
uuid = { version = "^1", features = ["v3", "v4", "v5", "v7", "serde"] }
ts-rs = { version = "^12", features = ["serde-compat", "uuid-impl"] }

chrono = { version = "^0.4", features = ["serde", "clock"], optional = true }
tracing-subscriber = { version = "^0.3", features = ["env-filter"], optional = true }
schemars = { version = "1.2.1", features = ["derive", "uuid1"] }

[dev-dependencies]
anyhow = "^1"
toml = "^0.8"

[profile.dev]
debug = 1
incremental = true

[profile.release]
opt-level = 3
lto = "thin"
