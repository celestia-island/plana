[package]
name = "arona"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["langyo <langyo.china@gmail.com>"]
license = "BUSL-1.1"
description = "Entelecheia protocol: JSON-RPC 2.0 message types and method definitions for TUI↔gateway communication"
repository = "https://github.com/celestia-island/arona"
publish = true

[dependencies]
serde = { version = "^1", features = ["derive"] }
serde_json = "^1"
thiserror = "^2"
uuid = { version = "^1", features = ["v7", "serde"] }
ts-rs = { version = "^12", features = ["serde-compat", "serde-json-impl", "format", "uuid-impl"] }
